# PBG Grading — per-station conda environment spec.
#
# NOT the same file as config.yaml (station config).
# This file defines the Python environment only.
#
# Since the move to the on-camera pod-counter backend, this app is a pure
# web front-end: no depthai, no PyQt6, no OpenCV. All camera/NN work runs
# on the OAK 4 devices themselves (deployed from the Oak 4 App repo);
# this machine only talks HTTP to port 8808.
#
# Versions are pinned from the known-good development environment
# (conda env "grading"). To change a pin, verify on a dev machine first,
# commit, then `git pull` + re-run the setup script on each station.
name: grading
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.15
  # Web UI
  - dash=4.2.0
  - dash-bootstrap-components=2.0.4
  - plotly=6.6.0
  # Numerics (summary statistics for the trial-file append)
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.17.1
  # Config / export
  - pyyaml=6.0.3
  - python-dotenv=1.2.2
  - requests=2.34.2
  - dropbox=12.0.2
  - openpyxl=3.1.5   # read/write the trial .xlsx for Dropbox append
  # Tests (`python -m pytest tests/`)
  - pytest=8.4.2
