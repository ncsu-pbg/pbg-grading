# PBG Grading — station config (UI only).
#
# All pipeline/calibration configuration lives ON the cameras: each OAK 4
# runs the pod-counter app (deployed from the Oak 4 App repository), and
# calibration is done in the camera's own setup page
# (http://<device_ip>:8808/setup) which saves a config overlay on the
# camera. This file only tells the UI where the cameras are and where to
# put output.

output_dir: ./output

modes:
  pod:
    label: Pod
    device_ip: 10.80.32.101
    http_port: 8808
  seed:
    label: Seed
    device_ip: 10.80.32.100
    http_port: 8808
    # Seed samples are weighed after shelling — the weight is requested in
    # a popup when the run stops instead of being required before start.
    weight_after_stop: true
